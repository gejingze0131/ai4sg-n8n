<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI4SG Audit</title>
<!-- Served by n8n (workflow "AI4SG · D Audit Page", webhook /webhook/ai4sg-audit).
     The workflow replaces the DATA placeholder below with the extraction results.
     ?format=geo returns the map boundaries (geo.json, Natural Earth); Pass / Fail post to /webhook/ai4sg-review.
     Edit this file freely: changes show on the next page reload, no re-import needed. -->
<style>
:root{
  color-scheme:light;
  --bg:#f6f6f4; --surface:#ffffff; --surface-2:#f0efec; --border:#e0dfdb; --grid:#ecebe7;
  --text:#0b0b0b; --text-2:#4a4946; --muted:#72716c;
  --accent:#2a78d6; --accent-soft:#e3eefb; --accent-line:#8fb6e8;
  --good:#1a7f37; --good-soft:#e6f4ea; --warn:#8a5d00; --warn-soft:#fff4d6; --bad:#c62828; --bad-soft:#fdecec;
  --land:#e9e8e4; --land-line:#ffffff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Noto Sans Bengali","Bangla Sangam MN","Kohinoor Bangla","Noto Sans Devanagari","Noto Sans Thai",Thonburi,"PingFang SC",sans-serif}
.orig{font-family:"Noto Sans Bengali","Bangla Sangam MN","Kohinoor Bangla","Noto Sans Devanagari","Kohinoor Devanagari","Noto Sans Thai",Thonburi,-apple-system,sans-serif}
a{color:var(--accent)}
.wrap{max-width:1480px;margin:0 auto;padding:24px 16px 56px}
header.top{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-size:26px;margin:0 0 2px}
.sub{color:var(--text-2);font-size:15px}
.who{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--text-2)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px}
/* summary */
.summary{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:12px}
.kpi{padding:14px 16px}.kpi .l{color:var(--text-2);font-size:14px}.kpi .v{font-size:30px;font-weight:650;font-variant-numeric:tabular-nums}.kpi .d{color:var(--muted);font-size:13px}
.charts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));margin-bottom:18px}
.chart{padding:14px 16px}.chart h3{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--text-2)}
.bar{display:grid;grid-template-columns:minmax(0,58%) 1fr 30px;gap:8px;align-items:center;font-size:14px;margin:2px 0;padding:2px 4px;cursor:pointer;border-radius:6px}
.bar:hover{background:var(--surface-2)}
.bar .k{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t{height:12px}.bar .f{height:100%;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.bar .n{text-align:right;font-variant-numeric:tabular-nums}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
input,select,button,textarea{font:inherit;font-size:15px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 11px}
input[type=search]{flex:1;min-width:220px}
button{cursor:pointer}button:hover{background:var(--surface-2)}
/* layout */
.main{display:grid;gap:18px;grid-template-columns:minmax(320px,440px) 1fr;align-items:start}
@media (max-width:980px){.main{grid-template-columns:1fr}.detail{position:static!important;max-height:none!important}}
.list{display:flex;flex-direction:column;gap:10px}
.item{padding:14px 16px;cursor:pointer;border-left:4px solid transparent}
.item:hover{border-color:var(--border)}
.item.sel{border-left-color:var(--accent);background:var(--accent-soft)}
.item h4{margin:0 0 4px;font-size:16px;line-height:1.4}
.item .t2{color:var(--text-2);font-size:15px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip.dom{font-weight:600;border:1px solid transparent}
.chip.dom.d-healthcare{background:#e6f4ea;color:#1a6b34;border-color:#bfe3c9}
.chip.dom.d-public_service{background:#efe8fb;color:#5b3a9e;border-color:#d8c8f3}
.chip.dom.d-agriculture{background:#fff4d6;color:#7a5200;border-color:#f0dc9f}
.chip.dom.d-education{background:#e3eefb;color:#1d5aa6;border-color:#bcd5f2}
.chip.dom.d-general{background:var(--surface-2);color:var(--text-2);border-color:var(--border)}
.dombar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 14px}
.dombar .l{color:var(--text-2);font-size:15px;margin-right:4px}
.dombar button{border:1px solid var(--border);background:var(--surface);border-radius:18px;padding:5px 14px;font:inherit;font-size:15px;cursor:pointer;color:var(--text)}
.dombar button .n{color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.dombar button.on{background:var(--text);color:#fff;border-color:var(--text)}
.dombar button.on .n{color:#ddd}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:12px;padding:2px 10px;font-size:13px;color:var(--text-2);white-space:nowrap}
.flag{background:var(--warn-soft);color:var(--warn)}.flag.bad{background:var(--bad-soft);color:var(--bad)}
.pass{background:var(--good-soft);color:var(--good);font-weight:600}.fail{background:var(--bad-soft);color:var(--bad);font-weight:600}
.meter{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-2)}
.meter .m{width:90px;height:8px;background:var(--grid);border-radius:4px;overflow:hidden}.meter .m i{display:block;height:100%;background:var(--accent)}
.detail{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding:0}
.detail .body{padding:22px 24px 8px}
.detail h2{font-size:23px;margin:0 0 8px;line-height:1.35}
.titles{margin:10px 0 12px;padding:12px 14px;background:var(--surface-2);border-radius:10px}
.titles .o{font-size:17px}.titles .e{color:var(--text-2);font-size:15px;margin-top:3px}
.sec{margin-top:24px}.sec>h3{font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 10px}
.facts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.fact{border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.fact .h{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.fact .h b{font-size:15px}
.big{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.25}
.mid{font-size:18px;font-weight:600;line-height:1.35}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:15px;margin:6px 0 0}.kv dt{color:var(--muted)}.kv dd{margin:0}
.na{color:var(--muted);font-style:italic}
.ver{font-size:12px;padding:2px 8px;border-radius:10px;white-space:nowrap}
.ver.ok{background:var(--good-soft);color:var(--good)}.ver.no{background:var(--bad-soft);color:var(--bad)}.ver.none{background:var(--surface-2);color:var(--muted)}
.quotes{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.q{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:15px;border-top:1px dashed var(--border);padding-top:8px}
@media (max-width:640px){.q{grid-template-columns:1fr}}
.q .lab{font-size:12px;color:var(--muted);display:block}
details>summary{cursor:pointer;color:var(--accent);font-size:14px;margin-top:8px}
.ladder{display:flex;gap:3px;margin:8px 0}.ladder span{flex:1;height:10px;border-radius:2px;background:var(--grid)}.ladder span.on{background:var(--accent)}
.ladder-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.interp p{margin:6px 0}.interp .lbl{font-weight:600}
ul.gaps{margin:4px 0;padding-left:20px}
table.qt{width:100%;border-collapse:collapse;font-size:15px}table.qt td,table.qt th{border-bottom:1px solid var(--grid);padding:7px 8px;vertical-align:top;text-align:left}
table.qt th{color:var(--muted);font-weight:600;font-size:13px}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cbar{height:10px;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.banner{padding:11px 14px;border-radius:10px;margin:12px 0;font-size:15px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}.banner.bad{background:var(--bad-soft);color:var(--bad)}.banner.good{background:var(--good-soft);color:var(--good)}
pre{white-space:pre-wrap;font-size:13px;background:var(--surface-2);padding:10px;border-radius:8px;max-height:340px;overflow:auto}
.empty{padding:48px;text-align:center;color:var(--muted)}
/* relevance score */
.score{display:grid;grid-template-columns:auto 1fr;gap:6px 20px;align-items:start}
.score .n{font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}.score .n small{font-size:18px;color:var(--muted);font-weight:500}
.crit{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.crit li{display:grid;grid-template-columns:24px 1fr auto;gap:6px;font-size:15px;align-items:baseline}
.crit .y{color:var(--good);font-weight:700}.crit .x{color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:6px}
/* map */
.mapwrap{display:grid;grid-template-columns:minmax(220px,360px) 1fr;gap:16px;align-items:start}
@media (max-width:760px){.mapwrap{grid-template-columns:1fr}}
svg.map{width:100%;height:auto;background:#f7f9fc;border:1px solid var(--grid);border-radius:10px}
svg.map .rg{fill:var(--land);stroke:var(--land-line);stroke-width:.8}
svg.map .rg.on{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.2}
svg.map .ct{fill:none;stroke:#b9b8b3;stroke-width:1}
svg.map .ct.on{fill:var(--accent-soft);fill-opacity:.9}
svg.map .pt{fill:var(--accent);stroke:#fff;stroke-width:2}
svg.map text{font-size:12px;fill:var(--text);paint-order:stroke;stroke:#fff;stroke-width:3px}
/* review bar */
.review{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 24px 14px;border-radius:0 0 12px 12px;box-shadow:0 -4px 12px rgba(0,0,0,.04)}
.review .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.review textarea{flex:1;min-width:220px;min-height:40px;height:40px;resize:vertical}
.btn-pass{background:var(--good);color:#fff;border-color:var(--good);font-weight:600}.btn-pass:hover{background:#156a2e}
.btn-fail{background:var(--bad);color:#fff;border-color:var(--bad);font-weight:600}.btn-fail:hover{background:#a82020}
.review .st{font-size:14px;color:var(--text-2);margin-bottom:8px}
a.stag{display:inline-block;font-size:12px;font-weight:600;padding:0 6px;border-radius:8px;background:var(--accent-soft);color:var(--accent);text-decoration:none;margin-left:3px;white-space:nowrap}
a.stag:hover{text-decoration:underline}
.back{display:inline-block;margin-bottom:10px;font-size:14px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.tabs button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
#pending table.qt td{vertical-align:top}#pending .why{color:var(--text-2);font-size:14px}
.btn-go{background:var(--accent);color:#fff;border-color:var(--accent)}.btn-go:hover{background:var(--accent);opacity:.9}.btn-go:disabled{opacity:.45;cursor:default}
.item .kind{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:2px}
ul.tagged{margin:4px 0 0;padding-left:18px}ul.tagged li{margin:3px 0}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1>AI for Social Good · Audit</h1><div class="sub" id="meta"></div></div>
    <div>
      <div class="who"><label for="me">Your name (saved with your decisions)</label><input id="me" placeholder="e.g. Anna" style="width:180px"></div>
      <div class="sub" style="text-align:right;margin-top:6px"><a href="/form/ai4sg-run">Start a new run</a></div>
    </div>
  </header>

  <nav class="dombar" id="dombar" aria-label="Domain"></nav>
  <section class="summary" id="kpis"></section>
  <section id="runs" style="margin-bottom:16px"></section>
  <section class="charts">
    <div class="card chart"><h3>By country · click to filter</h3><div id="c-country"></div></div>
    <div class="card chart"><h3>AI technology · click to filter</h3><div id="c-tech"></div></div>
    <div class="card chart"><h3>Relevance score · best source</h3><div id="c-score"></div></div>
    <div class="card chart"><h3>Deployment stage</h3><div id="c-stage"></div></div>
    <div class="card chart"><h3>Strength of evidence for benefits</h3><div id="c-evidence"></div></div>
  </section>

  <div class="filters">
    <input type="search" id="q" placeholder="Search project or P-code, organisation, place, source title…">
    <select id="f-country"><option value="">All countries</option></select>
    <select id="f-tech"><option value="">All technologies</option></select>
    <select id="f-status">
      <option value="">Awaiting review</option>
      <option value="all">All projects</option>
      <option value="approved">Passed</option>
      <option value="rejected">Failed</option>
      <option value="attention">Needs attention (warning flags)</option>
    </select>
    <select id="f-sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="hi">Highest relevance score</option><option value="lo">Lowest relevance score</option><option value="domain">Domain, then newest</option><option value="country">Country, then newest</option><option value="name">Name A–Z</option></select>
    <button id="reset">Reset</button>
  </div>

  <div class="main">
    <div><div class="sub" id="count" style="margin-bottom:8px"></div><div class="list" id="list"></div></div>
    <div class="card detail" id="detail"><div class="empty">Select a project on the left.</div></div>
  </div>

  <section class="card" id="pending" style="margin-top:24px;padding:16px 20px"></section>
</div>

<script>
const DATA = /*__DATA__*/[];
const RUNS = /*__RUNS__*/[];
const RUNS_ALL = RUNS;
const PROJECTS = /*__PROJECTS__*/[];

// ---------- vocabularies ----------
const LANG = {bn:'Bengali',hi:'Hindi',id:'Indonesian',th:'Thai',ta:'Tamil',ur:'Urdu',ne:'Nepali',en:'English',ms:'Malay',vi:'Vietnamese',si:'Sinhala',tl:'Filipino',km:'Khmer',sw:'Swahili',am:'Amharic'};
const DOMAIN = {health:'Health',agriculture_food:'Agriculture & food',education:'Education',financial_inclusion:'Financial inclusion',
  social_protection:'Social protection',water_sanitation:'Water & sanitation',climate_disaster:'Climate & disaster',gender:'Gender',
  public_services:'Public services',accessibility:'Accessibility',humanitarian:'Humanitarian',other:'Other'};
const RUNDOM = {healthcare:'Healthcare',public_service:'Public service',agriculture:'Agriculture',education:'Education',general:'All-domain runs'};
// domain tags: the domains a source belongs to (set by the screen; a source can sit in several, e.g. a TB-screening paper found by a
// public-service run is tagged Healthcare), else the domain of the run that found it. A project has the tags of its sources.
// The domain bar at the top limits the whole page (list, figures, Not analysed yet) to the items with that tag.
const tagsOf = (x) => (x && x.tags && x.tags.length ? x.tags : [(x && x.runDomain) || 'general']);
const domOf = (x) => tagsOf(x)[0];
let DOM = '';
const inD = (x) => !DOM || tagsOf(x).includes(DOM);
const domChip = (x) => tagsOf(x).map(d => `<span class="chip dom d-${esc(d)}" title="Domain tag${x.runDomain && x.runDomain !== d ? ` (found by a ${esc(RUNDOM[x.runDomain] || x.runDomain)} run)` : ''}">${esc(RUNDOM[d] || d)}</span>`).join('');
const AIROLE = {information_only:'Information only (no decision)',assistive:'Assistive: a person decides',triage_prioritisation:'Triage / prioritisation',
  autonomous_decision:'Autonomous: AI output is the decision',unknown:'Not stated'};
const GOVROLE = {none:'None',partner:'Partner',funder:'Funder',implementer:'Implementer',adopted:'Adopted / procured',regulator:'Regulator',unknown:'Not stated'};
const DSRC = {system_logs:'System logs',programme_records:'Programme records',independent_measurement:'Independent measurement',survey_self_report:'Survey / self-report',
  developer_or_government_claim:'Claim by developer or government',modelled:'Modelled',not_stated:'Not stated'};
const DBNAME = {openalex:'OpenAlex',europepmc:'Europe PMC',eric:'ERIC',worldbank:'World Bank',aearct:'AEA RCT Registry',web:'Web search'};
const RELNAME = {cites:'cited by',cited_by:'citing',mentioned_in:'named in'};
const STAGE = {idea:'Idea / announced',pilot:'Pilot',scaled:'Scaled',discontinued:'Discontinued',unknown:'Unknown'};
const TECH = {computer_vision:'Computer vision',speech_nlp:'Speech & language',llm_chatbot:'LLM / chatbot',predictive_ml:'Predictive ML',
  remote_sensing:'Remote sensing',recommender_decision_support:'Decision support',robotics:'Robotics',other:'Other',unspecified:'Not specified'};
const TSTATUS = {planned:'Planned',ongoing:'Ongoing',completed:'Completed',discontinued:'Discontinued',unknown:'Unknown'};
const COSTCAT = {hardware_equipment:'Hardware & equipment',software_development:'Software development',data:'Data',staff_training:'Staff & training',
  operations_maintenance:'Operations & maintenance',research_evaluation:'Research & evaluation',total_budget:'Total budget',other:'Other'};
const EVID = [['rct','RCT'],['quasi_experimental','Quasi-experimental'],['observational','Observational'],['pilot_report','Pilot report'],['anecdotal','Anecdotal'],['none','None']];
const SRC = {news:'News',gov_report:'Government report',gov_website:'Government website',journal:'Journal',conference_report:'Conference',open_source:'Open source',ngo_report:'NGO report',other:'Other'};
const FLAGS = {
  quote_not_found:['Quote not found in source','bad'], cost_without_evidence:['Cost figure not backed by a quote','bad'],
  benefit_without_evidence:['Benefit claim not backed by a quote','bad'], no_text_extracted:['Source text could not be read','warn'],
  extraction_failed:['AI extraction failed','bad'], outcome_without_evidence:['Outcome not backed by a found quote','bad'],
  abstract_only:['Only the abstract could be read','warn']};
const CRITERIA_HELP = 'Five criteria, 20 points each. A criterion counts only when its fields are filled and at least one of its quotes is found word for word in the source.';

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = (id) => document.getElementById(id);
const nfmt = (n) => (typeof n === 'number' && isFinite(n)) ? n.toLocaleString('en-US') : '';
const langName = (c) => LANG[c] || (c ? c.toUpperCase() : '—');
const store = { get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

// ---------- normalise rows (older results lack the newer blocks) ----------
const rows = DATA.map((r) => {
  const f = r.fields || {};
  const p = f.project || {};
  const src = f.source || {};
  const tech = f.technology || (p.ai_technique ? { specific: p.ai_technique, category: '' } : {});
  const loc = f.location || (p.location ? { places: [], as_text: p.location } : {});
  const row = {
    id: 's' + r.source_id, sid: r.source_id, eid: r.id || null, analysed: r.id != null,
    url: r.url, created: r.created_at, status: r.status, engine: r.search_engine || '',
    runId: r.run_id || '', textLevel: r.text_level || '',
    database: r.database || '', doi: r.doi || '', files: Array.isArray(r.files) ? r.files : [], textChars: r.text_chars,
    via: r.via_id ? { id: 's' + r.via_id, title: r.via_title || r.via_url, rel: r.relation } : null,
    projectCode: r.project_code || '', projectName: r.project_name || '', projectMethod: r.project_method || '', projectReason: r.project_reason || '',
    projectGuess: r.project_guess || '', toolCode: r.tool_code || '', toolName: r.tool_name || '',
    duplicateOf: r.duplicate_of ? String(r.duplicate_of) : '',
    country: (p.countries && p.countries[0]) || r.country || '',
    lang: src.language || r.language || '', sourceType: r.source_type, flags: r.flags || [],
    score: r.relevance_score, relevance: f.relevance || null, screenRel: r.screen_relevance,
    failed: r.id != null && !r.fields, raw: r.fields || r.source_screen || null, isAi: f.is_ai4sg !== false,
    headline: f.headline || p.name || (r.source_screen && r.source_screen.headline_en) || r.title_en || r.title || r.url,
    titleOrig: src.title_original || r.title || '', titleEn: src.title_en || r.title_en || '',
    publisher: src.publisher || '', published: src.published || '', summary: src.summary_en || r.why_relevant || '',
    project: p, tech, timeline: f.timeline || {}, loc, reach: f.reach || {}, cost: f.cost || {}, benefit: f.benefit || {},
    evid: f.evidence_strength || {}, interp: typeof f.interpretation === 'object' && f.interpretation ? f.interpretation : { overall: f.interpretation },
    risks: Array.isArray(f.risks_limitations) ? f.risks_limitations : [],
    use: f.use || {}, impl: f.implementation || {}, outcomes: Array.isArray(f.outcomes) ? f.outcomes : [],
      dfields: Array.isArray(f.domain_fields) ? f.domain_fields : [],
    evidence: Array.isArray(f.evidence) ? f.evidence : [],
    decision: r.review_decision || '', rcomment: r.review_comment || '', reviewer: r.reviewer || '', reviewedAt: r.reviewed_at || '',
  };
  row.domain = p.domain || ''; row.runDomain = r.run_domain || f.run_domain || '';
  row.tags = (Array.isArray(r.domain_tags) ? r.domain_tags : []).filter(Boolean); row.stage = p.deployment_stage || 'unknown'; row.techCat = tech.category || 'unspecified';
  row.filtered = r.status === 'filtered_out' || (row.analysed && !row.failed && !row.isAi);
  row.queued = r.status === 'queued';
  row.duplicate = r.status === 'duplicate';   // the same document as another source (the organiser of stage ②): not analysed
  row.notDownloaded = !row.analysed && !row.filtered && !row.queued && !row.duplicate;   // download failed (or the run stopped before the screen)
  row.screen = (f && f.screen) || r.source_screen || null;
  row.pick = r.pick || null;   // the analysis selection's decision for this source: {selected, rank, reason, method}
  if (row.screen && !row.summary) row.summary = row.screen.reason ? `Screen: ${row.screen.reason}` : '';

function reviewBar(r) {

    <div class="note" id="rv-msg"></div></div>`;
}
function wireReview(r) {
  const send = (decision) => {
    const reviewer = $('me').value.trim();
    if (!reviewer) { $('rv-msg').textContent = 'Please enter your name at the top of the page first.'; $('me').focus(); return; }
    const comment = $('rv-comment').value.trim();
    $('rv-msg').textContent = 'Saving…';
    fetch(location.pathname.replace(/ai4sg-audit\/?$/, 'ai4sg-review'), { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(r.kind === 'project' ? { project_id: r.pid, decision, comment, reviewer } : { extraction_id: Number(r.eid), decision, comment, reviewer }) })
      .then(x => x.json()).then(res => {
        if (!res.ok) throw new Error(res.error || 'not saved');
        Object.assign(r, { decision, rcomment: comment, reviewer, reviewedAt: res.reviewed_at || new Date().toISOString(), changed: false });
        const P = projectOf[String(r.sid)]; if (P) reviewState(P);
        kpis(); render(); detail(r);
        $('rv-msg').textContent = 'Saved.';
      }).catch(e => { $('rv-msg').textContent = 'Could not save (' + e.message + '). Is the system still online?'; });
  };
  const bp = $('rv-pass'), bf = $('rv-fail');
  if (bp) bp.onclick = () => send('approved');
  if (bf) bf.onclick = () => send('rejected');
}

  if (g === 'queued' || g === 'screened') return [sc.relevance != null ? `Screen ${Math.round(100 * sc.relevance)}%` : '', sc.in_domain === false ? 'outside the domain' : '',
    sc.is_ai4sg === false ? 'not AI4SG' : '', sc.reason || ''].filter(Boolean).join(' · ');
  if (g === 'duplicate') { const o = bySid[r.duplicateOf]; return `Same document as S${r.duplicateOf}${o ? ' · ' + o.headline : ''}${r.pick && r.pick.group_reason ? ' · ' + r.pick.group_reason : ''}`; }

  const msg = $('na-msg'); if (msg) msg.textContent = 'Sending…';
  fetch(endpoint('ai4sg-analyse'), { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ source_ids: ids.map(Number), reviewer: $('me').value.trim() }) })
    .then(x => x.json()).then(res => {
      if (!res.ok) throw new Error(res.error || 'not sent');
      ids.forEach(id => { naSent.add(String(id)); naSel.delete(String(id)); });
      pendingSection();
      const m = $('na-msg'); if (m) m.textContent = `Sent ${res.sources} source${res.sources === 1 ? '' : 's'} to the analysis: reload in about ${Math.max(1, res.sources)} minute${res.sources === 1 ? '' : 's'}.`;
    }).catch(e => { const m = $('na-msg'); if (m) m.textContent = 'Could not send (' + e.message + ').'; });
}

// ---------- list + filters ----------
let selected = null;
function sourceItem(r) {
  return `<div class="card item ${selected === r.id ? 'sel' : ''}" data-id="${esc(r.id)}">
      <div class="kind">Source${r.analysed && !r.filtered ? ' · not linked to a project' : ''}</div><h4>${esc(r.headline)}</h4>
      ${r.titleOrig && r.lang && r.lang !== 'en' ? `<div class="t2 orig" lang="${esc(r.lang)}">${esc(r.titleOrig)}</div>` : ''}
      <div class="chips">${domChip(r)}${chips(r)}${decisionChip(r)}${r.flags.length ? `<span class="chip flag">⚠ ${r.flags.length} flag${r.flags.length > 1 ? 's' : ''}</span>` : ''}
        ${r.filtered ? `<span class="chip flag">Filtered out${r.screen && r.screen.relevance != null ? ' · screen ' + Math.round(100 * r.screen.relevance) + '%' : ''}</span>` : ''}${r.failed ? '<span class="chip flag bad">Failed</span>' : ''}
        ${r.queued ? `<span class="chip">Queued${r.screen && r.screen.relevance != null ? ' · screen ' + Math.round(100 * r.screen.relevance) + '%' : ''}</span>` : ''}${r.notDownloaded ? '<span class="chip flag bad">Not downloaded</span>' : ''}</div>
      ${!r.analysed || r.filtered ? '' : `<div class="meter" style="margin-top:8px">Relevance score <span class="m"><i style="width:${r.score || 0}%"></i></span>${r.score != null ? r.score + ' / 100' : 'not scored'}</div>`}
    </div>`;
}
function projectItem(P) {
  if (P.single && P.srcRows[0]) {   // one source: the item is the source itself; the decision is the project's
    const r = P.srcRows[0];
    return `<div class="card item ${selected === P.id ? 'sel' : ''}" data-id="${esc(P.id)}">
      <div class="kind">${esc(P.code)} · ${esc(SRC[r.sourceType] || r.sourceType || 'source')}</div><h4>${esc(r.headline)}</h4>
      ${r.titleOrig && r.lang && r.lang !== 'en' ? `<div class="t2 orig" lang="${esc(r.lang)}">${esc(r.titleOrig)}</div>` : ''}
      <div class="chips">${domChip(P)}${[r.country, STAGE[r.stage], (EVID.find(e => e[0] === (r.evid.type || 'none')) || ['', ''])[1]].filter(Boolean).map(x => `<span class="chip">${esc(x)}</span>`).join('')}
        ${decisionChip(r)}${r.flags.length ? `<span class="chip flag">⚠ ${r.flags.length} flag${r.flags.length > 1 ? 's' : ''}</span>` : ''}${r.failed ? '<span class="chip flag bad">Failed</span>' : ''}</div>
      <div class="meter" style="margin-top:8px">Relevance score <span class="m"><i style="width:${r.score || 0}%"></i></span>${r.score != null ? r.score + ' / 100' : 'not scored'}</div>
    </div>`;
  }
  const types = count(P.srcRows, r => SRC[r.sourceType] || r.sourceType);
  return `<div class="card item ${selected === P.id ? 'sel' : ''}" data-id="${esc(P.id)}">
      <div class="kind">Deployment ${esc(P.code)} · ${P.sids.length} source${P.sids.length > 1 ? 's' : ''}${Object.keys(types).length ? ': ' + esc(Object.entries(types).map(([k, n]) => `${n} ${k.toLowerCase()}`).join(', ')) : ''}</div>
      <h4>${esc(P.name)}</h4>
      ${P.llm && P.llm.summary ? `<div class="t2">${esc(String(P.llm.summary).replace(/\s?\[S\d+\]/g, '').split(/(?<=\.)\s/)[0].slice(0, 220))}</div>` : ''}
      <div class="chips">${domChip(P)}${P.countries.map(c => `<span class="chip">${esc(c)}</span>`).join('')}<span class="chip">${esc(STAGE[P.stage] || P.stage)}</span>
        <span class="chip">${esc((EVID.find(e => e[0] === P.evid) || ['', 'No evidence'])[1])}</span>${P.toolCode ? `<span class="chip">Tool: ${esc(P.toolName)}</span>` : ''}${reviewChip(P)}
        ${P.flags.length ? `<span class="chip flag">⚠ ${P.flags.length} flag type${P.flags.length > 1 ? 's' : ''}</span>` : ''}${P.pending ? '<span class="chip">summary pending</span>' : ''}</div>
      <div class="meter" style="margin-top:8px">Best source score <span class="m"><i style="width:${P.score || 0}%"></i></span>${P.score != null ? P.score + ' / 100' : 'not scored'}</div>
    </div>`;
}
function render() {
  const q = $('q').value.trim().toLowerCase(), fc = $('f-country').value, ft = $('f-tech').value, fs = $('f-status').value;
  const sourceView = ['queued', 'filtered', 'notdl'].includes(fs);
  let list;
  if (sourceView) {
    list = rowsD().filter(r => (fs === 'filtered' ? r.filtered : fs === 'queued' ? r.queued : r.notDownloaded) && (!fc || r.country === fc) &&
      (!q || [r.headline, r.titleEn, r.titleOrig, r.summary, r.projectGuess].join(' ').toLowerCase().includes(q)));
  } else {
    const want = (x) => fs === 'all' || (fs === '' && !x.decision) || (fs === 'attention' && x.attention) || ((fs === 'approved' || fs === 'rejected') && x.decision === fs);
    const ps = inScope().filter(P => (!fc || P.countries.includes(fc)) && (!ft || P.techCat === ft) && want(P) &&
      (!q || [P.name, P.code, P.dbName, ...P.aliases, ...(P.sy.orgs || []), ...(P.sy.products || []), ...(P.sy.places || []).map(x => x.name), P.llm.summary,
              ...P.srcRows.map(r => [r.headline, r.titleEn, r.titleOrig].join(' '))].join(' ').toLowerCase().includes(q)));
    const ls = looseD().filter(r => (!fc || r.country === fc) && (!ft || r.techCat === ft) && want(r) &&
      (!q || [r.headline, r.titleEn, r.titleOrig, r.summary].join(' ').toLowerCase().includes(q)));
    list = [...ps, ...ls];
  }
  const sv = (x) => (x.score == null ? -1 : x.score);
  const newest = (a, b) => String(b.created || '').localeCompare(String(a.created || ''));
  const nameOf = (x) => String(x.kind === 'project' ? (x.single && x.srcRows[0] ? x.srcRows[0].headline : x.name) : x.headline || '');
  const cmp = { hi: (a, b) => sv(b) - sv(a) || newest(a, b), lo: (a, b) => sv(a) - sv(b) || newest(a, b), new: newest, old: (a, b) => newest(b, a),
    domain: (a, b) => domOf(a).localeCompare(domOf(b)) || newest(a, b),
    country: (a, b) => String(a.country || '').localeCompare(String(b.country || '')) || newest(a, b),
    name: (a, b) => nameOf(a).localeCompare(nameOf(b)) }[$('f-sort').value] || newest;
  list = list.slice().sort(cmp);
  const np = list.filter(x => x.kind === 'project').length;
  $('count').textContent = fs === 'filtered' ? `${list.length} sources filtered out by the AI screen` : fs === 'queued' ? `${list.length} sources waiting for analysis`
    : fs === 'notdl' ? `${list.length} sources that could not be downloaded` : `${np} project${np === 1 ? '' : 's'}${list.length > np ? ` and ${list.length - np} unlinked source${list.length - np === 1 ? '' : 's'}` : ''} shown`;
  $('list').innerHTML = list.map(x => x.kind === 'project' ? projectItem(x) : sourceItem(x)).join('') || '<div class="empty">Nothing matches these filters.</div>';
  $('list').querySelectorAll('.item').forEach(el => el.onclick = () => open_(el.dataset.id));
}
function fillSelect(el, values, label) { values.forEach(v => el.insertAdjacentHTML('beforeend', `<option value="${esc(v)}">${esc(label(v))}</option>`)); }
fillSelect($('f-country'), [...new Set([...projects.flatMap(P => P.countries), ...rows.map(r => r.country)].filter(Boolean))].sort(), v => v);
fillSelect($('f-tech'), [...new Set(inScope().map(P => P.techCat))].sort(), v => TECH[v] || v);
['q', 'f-country', 'f-tech', 'f-status', 'f-sort'].forEach(id => $(id).addEventListener(id === 'q' ? 'input' : 'change', render));
$('reset').onclick = () => { ['q', 'f-country', 'f-tech', 'f-status'].forEach(id => $(id).value = ''); $('f-sort').value = 'new'; render(); };
$('me').value = store.get('ai4sg-reviewer');
$('me').addEventListener('change', () => store.set('ai4sg-reviewer', $('me').value.trim()));

function domBar() {
  const doms = Object.keys(RUNDOM).filter(k => rows.some(r => tagsOf(r).includes(k)) || RUNS_ALL.some(r => (r.domain || 'general') === k));
  if (DOM && !doms.includes(DOM)) DOM = '';
  const n = (k) => projects.filter(P => P.analysed && (!k || tagsOf(P).includes(k))).length;
  $('dombar').innerHTML = doms.length < 2 && !DOM ? '' : `<span class="l">Domain</span>` +
    [['', 'All domains'], ...doms.map(k => [k, RUNDOM[k] || k])].map(([k, l]) =>
      `<button data-dom="${esc(k)}" class="${DOM === k ? 'on' : ''}" title="Show only this domain everywhere on the page">${esc(l)}<span class="n">${n(k)}</span></button>`).join('');
  $('dombar').querySelectorAll('[data-dom]').forEach(b => b.onclick = () => { setDom(b.dataset.dom); });
}
function setDom(k) {
  DOM = k; store.set('ai4sg-domain', k); naSel.clear();
  domBar(); kpis(); charts(); render(); pendingSection();
  const cur = selected && (projects.find(x => x.id === selected) || rows.find(x => x.id === selected));
  if (!cur || !inD(cur)) { const f = inScope().find(P => !P.decision) || inScope()[0] || looseD()[0];
    if (f) open_(f.id); else { selected = null; render(); $('detail').innerHTML = '<div class="empty">Nothing analysed in this domain yet.</div>'; } }
}
DOM = store.get('ai4sg-domain');
domBar();
kpis(); charts(); render(); pendingSection();
const first = inScope().find(P => !P.decision) || inScope()[0];
if (first) open_(first.id);
else if (looseD()[0]) { selected = looseD()[0].id; render(); detail(looseD()[0]); }
loadGeo();
</script>
</body>
